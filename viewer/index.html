<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Automail Viewer</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css?v=20260503-5">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          <div>
            <h1>Automail</h1>
            <p id="statusText">Ready</p>
          </div>
        </div>
        <form id="searchForm" class="search">
          <label>
            <span>API</span>
            <output id="apiBaseText" class="readonly-field"></output>
          </label>
          <label>
            <span>Sender</span>
            <input id="senderInput" type="search" placeholder="sender@example.com">
          </label>
          <label>
            <span>Keyword</span>
            <input id="keywordInput" type="search" placeholder="subject or content">
          </label>
          <label>
            <span>Latest</span>
            <input id="limitInput" type="number" min="1" max="100" value="50">
          </label>
          <label class="toggle-field">
            <span>Refresh</span>
            <span class="toggle">
              <input id="autoRefreshInput" type="checkbox" checked>
              <span>Auto</span>
            </span>
          </label>
          <button type="submit">Search</button>
        </form>
        <button id="settingsButton" class="settings-button" type="button" aria-haspopup="dialog" aria-expanded="false">Settings</button>
      </header>

      <section class="workspace">
        <aside class="mailboxes">
          <div class="panel-head">
            <h2>Mailboxes</h2>
            <button id="refreshButton" type="button">Refresh</button>
          </div>
          <div id="mailboxList" class="mailbox-list"></div>
        </aside>

        <section class="messages">
          <div class="panel-head">
            <h2 id="messageTitle">All Mail</h2>
            <p id="messageCount"></p>
          </div>
          <div id="messageList" class="message-list"></div>
        </section>

        <article class="detail">
          <div id="messageDetail" class="detail-inner empty">
            <p>Select a message to inspect it.</p>
          </div>
        </article>
      </section>
    </main>
    <div id="settingsBackdrop" class="settings-backdrop" hidden></div>
    <aside id="settingsPanel" class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
      <div class="settings-head">
        <div>
          <h2 id="settingsTitle">Settings</h2>
          <p>Local viewer preferences</p>
        </div>
        <button id="settingsCloseButton" class="settings-close" type="button" aria-label="Close settings">Close</button>
      </div>
      <fieldset class="setting-group">
        <legend>Default body rendering</legend>
        <label class="setting-option">
          <input type="radio" name="defaultBodyMode" value="text">
          <span>
            <strong>Text</strong>
            <small>Fastest and safest default.</small>
          </span>
        </label>
        <label class="setting-option">
          <input type="radio" name="defaultBodyMode" value="html">
          <span>
            <strong>Render HTML</strong>
            <small>Default. Renders email layout in a sandbox without scripts.</small>
          </span>
        </label>
      </fieldset>
    </aside>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="./app.js?v=20260503-5" type="module"></script>
  </body>
</html>
